# Publica o app da aula no GitHub Pages a cada push na branch.
# O aluno abre a URL e vê os defeitos; quem for consertar clona o repositório.
name: Publicar virta-aula

on:
  push:
    branches: [main, claude/empacotar-exe-minicurso]
    paths: ['minicurso/virta-aula/**', '.github/workflows/deploy-virta-aula.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minicurso/virta-aula
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: minicurso/virta-aula/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
