# Empacotamento para a sala de aula: um zip com o exe, o agents.json e as skills
# lado a lado, do jeito que o skill-registry e o agent-registry já procuram
# (path.dirname(app.getPath('exe'))). Sem instalador, para rodar sem admin.
appId: com.minicurso.iflow
productName: IFlow

# node-pty 1.1.0 é addon Node-API e publica binários prontos para win32-x64, então
# não há nada para recompilar — e é isso que permite montar o zip de Windows numa
# máquina Linux. Com o rebuild ligado, o node-gyp aborta: não cross-compila.
npmRebuild: false

directories:
  output: release

files:
  - '!src/**'
  - '!electron.vite.config.*'
  - '!tsconfig.json'
  - '!electron-builder.yml'
  # O build nativo local (Linux, na máquina que empacota) não serve no Windows e
  # fica na frente do prebuild na ordem de busca do node-pty.
  - '!node_modules/node-pty/build/**'
  - '!node_modules/node-pty/prebuilds/darwin-*/**'

# node-pty não pode ficar dentro do asar: o ConPTY carrega uma DLL de verdade de
# third_party/conpty/win10-x64/, e DLL não é carregável de dentro de um archive.
asarUnpack:
  - '**/node_modules/node-pty/**'

# Ao lado do exe, não em resources/: é onde os registries procuram, e é o que
# permite o aluno abrir o agents.json e as skills num editor de texto.
extraFiles:
  - from: agents.json
    to: agents.json
  - from: skills
    to: skills
  - from: hooks
    to: hooks
  # O zip tem que se explicar sozinho: quem recebe descompacta e roda o
  # instalador, sem precisar do repositório nem de instruções por fora.
  - from: minicurso/instalar.mjs
    to: instalar.mjs
  - from: minicurso/LEIA-ME-LABORATORIO.txt
    to: LEIA-ME.txt
  # O projeto que os alunos vão mexer. O preparar-maquina.ps1 copia daqui para
  # a pasta de trabalho de cada máquina.
  - from: minicurso/projeto-exemplo
    to: projeto-exemplo
    filter:
      - '**/*'
      - '!**/node_modules/**'
      - '!**/dist/**'

win:
  # Um .exe sem ícone e sem descrição cai no pior dos dois mundos: o SmartScreen
  # avisa igual e o aviso ainda mostra um binário anônimo. Isto não remove o
  # aviso - só assinatura remove - mas faz o que aparece nele dizer o que é.
  icon: build/icon.ico
  target:
    - target: zip
      arch:
        - x64
  artifactName: iflow-${version}-win-x64.${ext}
